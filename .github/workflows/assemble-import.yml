name: Assemble import parts
on:
  push:
    paths:
      - ".import-parts/**"
      - ".github/workflows/assemble-import.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/import-neiaentrepreneurhub-5bca
      - name: Assemble large files
        run: |
          set -euo pipefail
          assemble() {
            local dest="$1"
            local key="$2"
            local dir=".import-parts/${key}"
            test -d "$dir"
            mkdir -p "$(dirname "$dest")"
            cat "$dir"/*.part > "$dest"
            rm -rf "$dir"
            echo "assembled $dest ($(wc -c < "$dest") bytes)"
          }
          assemble "bun.lock" "bun.lock"
          assemble "src/components/EntrepreneurshipApp.tsx" "EntrepreneurshipApp.tsx"
          assemble "src/content/customer-interview-lab.html" "customer-interview-lab.html"
          rm -rf .import-parts
          rm -f .github/workflows/assemble-import.yml
          rm -rf size-probe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Assemble large NEIA hub import files"
          git push
