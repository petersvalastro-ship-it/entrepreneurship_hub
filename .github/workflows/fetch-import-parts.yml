name: Fetch import parts
on:
  push:
    paths:
      - ".github/workflows/fetch-import-parts.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/import-neiaentrepreneurhub-5bca
      - name: Download and extract import parts
        run: |
          set -euo pipefail
          curl -fsSL "https://tmpfiles.org/dl/1794366012.1c49306eca07b587/wXAnWFBQmaVO/import-parts.tar.gz" -o /tmp/import-parts.tar.gz
          python3 - <<'PY'
          import hashlib
          h=hashlib.sha256(open('/tmp/import-parts.tar.gz','rb').read()).hexdigest()
          assert h=="84c5da94c8cb33cd9b202e65250eeaab63e14648154a96f2f44a8f007f5b46be", h
          print("sha ok", h)
          PY
          rm -rf .import-parts
          tar -xzf /tmp/import-parts.tar.gz
          test -f .import-parts/bun.lock/000.part
          test -f .import-parts/EntrepreneurshipApp.tsx/000.part
          test -f .import-parts/customer-interview-lab.html/000.part
          find .import-parts -type f | wc -l
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fetch-import-parts.yml
          git add -A
          git commit -m "Add import parts from staged tarball"
          git push
