name: Assemble large files
on:
  workflow_dispatch:
  push:
    paths:
      - 'tmp/**'
      - '.github/workflows/assemble-parts.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Assemble from tmp parts
        run: |
          python3 <<'PY'
          from pathlib import Path
          import hashlib

          def assemble_rebus():
              part0 = Path('src/content/rebus-studio.html').read_text()[:12000]
              rest = [
                  'tmp/rebus.part1',
                  'tmp/rebus.part2_0',
                  'tmp/rebus.part2_1',
                  'tmp/rebus.part2_2',
                  'tmp/rebus.part2_3',
                  'tmp/rebus.part3',
              ]
              if any(not Path(p).exists() for p in rest):
                  print('rebus parts incomplete, skip')
                  return False
              out = part0 + ''.join(Path(p).read_text() for p in rest)
              dest = Path('src/content/rebus-studio.html')
              if dest.read_text() == out:
                  print('rebus already assembled')
                  return False
              dest.write_text(out)
              print(f'rebus wrote {len(out)}')
              return True

          def assemble_prefixed(dest_path: str, safe: str, expected_chars: int, expected_sha: str):
              parts = sorted(Path('tmp/parts').glob(f'{safe}.*'))
              if not parts:
                  print(f'{dest_path}: no parts, skip')
                  return False
              out = ''.join(p.read_text() for p in parts)
              if len(out) != expected_chars:
                  print(f'{dest_path}: got {len(out)} expected {expected_chars}, skip')
                  return False
              sha = hashlib.sha256(out.encode()).hexdigest()
              if sha != expected_sha:
                  print(f'{dest_path}: sha mismatch {sha} != {expected_sha}, skip')
                  return False
              dest = Path(dest_path)
              dest.parent.mkdir(parents=True, exist_ok=True)
              if dest.exists() and dest.read_text() == out:
                  print(f'{dest_path}: already assembled')
                  return False
              dest.write_text(out)
              print(f'{dest_path}: wrote {len(out)}')
              return True

          changed = False
          changed |= assemble_rebus()
          specs = [
              ('src/lib/textbook-pages.ts', 'src__lib__textbook-pages.ts', 50217, 'bf8ea5d854de93de2eeede96fb4f69d52cd442cf94d5fafa943d454e15553a93'),
              ('src/content/customer-interview-lab.html', 'src__content__customer-interview-lab.html', 74984, '3befeae98c3df2f9d872c9a3f21858b7bded82fd52ba26edc00b121866455979'),
              ('src/components/EntrepreneurshipApp.tsx', 'src__components__EntrepreneurshipApp.tsx', 153220, '42c3a77dc462ed3a8ca7603a5f782f85ce985e0b55b68c36db19a2d72e0edd9e'),
              ('bun.lock', 'bun.lock', 194283, 'fa92a3b95d70f2628a21fae914ed91ca09c2dffd7f1c314c9c9825ac869852fc'),
          ]
          for dest, safe, chars, sha in specs:
              changed |= assemble_prefixed(dest, safe, chars, sha)
          if not changed:
              print('nothing to commit')
          Path('/tmp/assemble-changed').write_text('1' if changed else '0')
          PY
      - name: Commit assembled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Assemble large files from tmp parts"
            git push
          fi
