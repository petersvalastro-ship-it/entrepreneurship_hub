<!doctype html>
<html lang="en" style="height: auto; --vh: 7.68px; overflow: visible; scrollbar-width: none; font-size: clamp(12px, 10.2241px + 0.4228vw, 16px);"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assumption to Evidence · Customer Interview Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
  <style>
    :root { --ink:#241c30; --purple:#61249a; --pink:#cc2474; --line:#dfd5e2; --paper:#fffdfb; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); font-family:"DM Sans",sans-serif; }
    .display { font-family:"DM Sans",sans-serif; }
    .page-width { width:min(100% - 2rem,1050px); margin-inline:auto; }
    .eyebrow { text-transform:uppercase; letter-spacing:.16em; font-size:.7rem; font-weight:800; }
    .sheet { background:var(--paper); border:1px solid #e8dfe8; border-radius:5px; box-shadow:0 12px 35px rgba(36,28,48,.045); scroll-margin-top:20px; }
    .section-number { font-size:.77rem; font-weight:800; letter-spacing:.12em; color:var(--pink); flex:none; padding-top:.4rem; }
    .rule { height:2px; background:linear-gradient(90deg,var(--purple) 0 84px,#e9e1e9 84px); }
    .response { display:block; width:100%; min-height:92px; resize:vertical; padding:12px 14px; border:1px solid var(--line); border-radius:4px; background:repeating-linear-gradient(to bottom,#fff 0,#fff 29px,#eee8ef 30px); color:var(--ink); line-height:30px; }
    .response.short { min-height:58px; }
    .field-label { display:block; margin-bottom:8px; font-weight:700; line-height:1.45; }
    .reading p { margin:0 0 1rem; line-height:1.75; }
    .plan-card { border:1px solid #eadff0; background:#fff; } .plan-heading { display:flex; align-items:center; gap:10px; padding:16px 16px 10px; } .calendar-badge { display:grid; place-items:center; width:25px; height:25px; border-radius:7px; background:#fff0e8; color:#ed5738; font-weight:800; } .route-table-wrap { overflow-x:auto; } .route-table { width:100%; border-collapse:separate; border-spacing:0; font-size:.78rem; } .route-table th { padding:9px 10px; text-align:left; color:#fff; background:#61249a; font-size:.72rem; } .route-table th:first-child { border-top-left-radius:8px; } .route-table th:last-child { border-top-right-radius:8px; } .route-table td { padding:9px 10px; border-bottom:1px solid #eadff0; } .route-table tbody tr:nth-child(even) td { background:#faf6fb; } .route-table tbody tr:last-child td { border-bottom:0; } .route-table td:nth-child(2), .route-table th:nth-child(2) { width:68px; } .route-timeline { display:none; }
    .route-step { position:relative; min-width:0; padding-top:14px; border-top:2px solid #8d70a6; }
    .route-step:not(:last-child)::after { content:""; position:absolute; top:-5px; right:-6px; width:8px; height:8px; border-radius:50%; background:#e994bb; }
    .route-dot { position:absolute; top:-6px; left:0; width:10px; height:10px; border:2px solid #f6bfd8; border-radius:50%; background:#251936; }
    .route-label, .route-time { display:block; line-height:1.25; }
    .route-label { color:#fff; font-size:.86rem; }
    .route-time { margin-top:5px; color:#eadcf0; font-size:.75rem; }
    @media (max-width:700px) { .route-timeline { grid-template-columns:repeat(2,minmax(0,1fr)); row-gap:18px; } .route-step:not(:last-child)::after { display:none; } }
    .reading strong { color:var(--purple); }
    .choice { display:flex; align-items:center; gap:10px; padding:12px 14px; border:1px solid var(--line); border-radius:4px; cursor:pointer; background:white; }
    .choice:has(input:checked) { border-color:var(--purple); background:#f5edf9; }
    input[type=radio] { accent-color:var(--purple); width:17px; height:17px; flex:none; }
    .small-card { border:1px solid var(--line); border-radius:4px; background:white; padding:19px; }
    textarea:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible { outline:3px solid #e994bb; outline-offset:2px; }
    .hero-graphic { position:relative; aspect-ratio:1.27; overflow:hidden; border-radius:24px; background:linear-gradient(145deg,#fff7fc 0%,#ead8f4 100%); border:1px solid #ead7ef; }
    .hero-graphic::before { content:""; position:absolute; width:58%; height:58%; right:-8%; top:-12%; border-radius:50%; background:#f6bfd8; opacity:.7; }
    .hero-graphic::after { content:""; position:absolute; width:44%; height:44%; left:-10%; bottom:-13%; border-radius:50%; background:#bfa0d9; opacity:.55; }
    .hero-graphic-art { position:absolute; inset:12%; z-index:1; }
    .hero-graphic-card { position:absolute; inset:9% 7%; border:3px solid #61249a; border-radius:18px; background:#fffdfb; transform:rotate(-3deg); box-shadow:10px 12px 0 #d9c4e5; }
    .hero-graphic-card::before { content:""; position:absolute; left:12%; right:12%; top:18%; height:12px; border-radius:8px; background:#cc2474; box-shadow:0 30px 0 #eadff0, 0 60px 0 #eadff0; }
    .hero-graphic-card::after { content:"?"; position:absolute; right:12%; bottom:13%; width:54px; height:54px; display:grid; place-items:center; border-radius:50%; background:#61249a; color:#fff; font:700 32px Fraunces,serif; }
    .hero-graphic-people { position:absolute; left:12%; right:12%; bottom:12%; height:33%; display:flex; justify-content:space-around; align-items:end; }
    .hero-graphic-person { position:relative; width:22%; height:78%; border-radius:48% 48% 18% 18%; background:#61249a; }
    .hero-graphic-person::before { content:""; position:absolute; width:58%; aspect-ratio:1; left:21%; top:-42%; border-radius:50%; background:#f1a87e; border:3px solid #241c30; }
    .hero-graphic-person:nth-child(2) { height:100%; background:#cc2474; }
    .hero-graphic-person:nth-child(3) { height:66%; background:#d4492b; }
    @media print { .hero-graphic { max-height:190px; } }
    @media print {
      body { background:white !important; }
      .no-print { display:none !important; }
      .page-width { width:100%; }
      .sheet { box-shadow:none; border-color:#bbb; break-inside:avoid; margin-bottom:12px !important; }
      .hero-image { max-height:190px; }
      .response { min-height:64px; }
      .response.short { min-height:46px; }
      main { padding-top:12px !important; }
      @page { margin:14mm; }
    }
  </style>
